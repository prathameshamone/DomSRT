<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8" />
  <script>
    // GitHub Pages serves this for any unknown path.
    // Redirect to index.html, encoding the original path in the query string.
    var path = window.location.pathname + window.location.search + window.location.hash;
    window.location.replace('/DomSRT/?redirect=' + encodeURIComponent(path));  </script>
</head>

<body></body>

</html>
